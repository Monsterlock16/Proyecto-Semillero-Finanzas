<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu Finanzas - Ingresar</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login">
  <div class="caja">
    <h1>Tu Finanzas</h1>
    <p class="sub">Controla hoy, disfruta mañana</p>
    <input id="usuario" placeholder="Usuario" autocomplete="username">
    <input id="clave" type="password" placeholder="Clave" autocomplete="current-password">
    <div class="form">
      <button class="btn" id="entrar">Ingresar</button>
      <button class="btn sec" id="crear">Crear cuenta</button>
    </div>
    <p id="error" class="err"></p>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
